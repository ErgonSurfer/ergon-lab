[package]
name = "chronik-observer"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
axum = "0.7"
bitcoinsuite-core = { path = "../bitcoinsuite-core" }
bitcoinsuite-slp = { path = "../bitcoinsuite-slp" }
bytes = "1.4"
chronik-proto = { path = "../chronik-proto" }
chronik-runtime = { path = "../chronik-runtime" }
prost = "0.11"
tokio = { version = "1.25", features = ["net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempdir = "0.3"
