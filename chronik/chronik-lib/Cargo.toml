[package]
name = "chronik_lib"
version = "0.1.0"
edition = "2021"
# Standard-library OS file locks used by the Ergon host adapter.
rust-version = "1.89.0"
license = "MIT"

[lib]
# Compile to C-ABI
crate-type = ["staticlib"]

[features]
ergon-archival-probe = ["dep:prost", "dep:axum", "dep:chronik-proto", "dep:bitcoinsuite-slp"]
plugins = [
    "dep:pyo3",
    "chronik-db/plugins",
    "chronik-indexer/plugins",
    "chronik-http/plugins",
    "chronik-plugin/enabled",
]

[dependencies]
abc-rust-lint = { path = "../abc-rust-lint" }
abc-rust-error = { path = "../abc-rust-error" }

bitcoinsuite-core = { path = "../bitcoinsuite-core" }
bitcoinsuite-slp = { path = "../bitcoinsuite-slp", optional = true }

chronik-bridge = { path = "../chronik-bridge" }
chronik-db = { path = "../chronik-db" }
chronik-http = { path = "../chronik-http" }
chronik-indexer = { path = "../chronik-indexer" }
chronik-plugin = { path = "../chronik-plugin" }
chronik-util = { path = "../chronik-util" }
prost = { version = "0.11", optional = true }
axum = { version = "0.7", optional = true }
pyo3 = { version = "0.23.2", optional = true }
chronik-proto = { path = "../chronik-proto", optional = true }

# Bridge to C++
cxx = "1.0.138"

# Derive error enums
thiserror = "2.0.3"

# Async runtime
tokio = { version = "1.32", features = ["sync", "rt", "rt-multi-thread"] }

[build-dependencies]
# Build scripts for the cxx crate
cxx-build = "1.0.138"
