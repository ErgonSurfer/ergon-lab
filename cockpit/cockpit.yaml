        "units": {
          "status": "draft",
          "definitions": [
            {"quantity": "test process result", "unit": "exit status"},
            {"quantity": "repeat count", "unit": "processes"}
          ]
        },
        "uncertainty": ["The transport bytes passed local quarantine verification, but no independently generated public native-node report exists."],
        "limitations": ["The current ceiling is a component observation, not operator-binary or historical-chain parity."],
        "counter_evidence": {
          "status": "partial",
          "records": ["The r2 harness failed to enforce assertion totals and could retain raw paths.", "Tracking the verified unified-diff transport would create whitespace-check noise, so the future integration excludes that redundant artifact without adding a policy exception."]
