        "methods": {
          "status": "reviewed",
          "description": "Verify the exact quarantine inventory, apply the hash-bound transport diff to the exact public baseline index, check the governed postimage and reversible tree delta, run the fail-closed harness self-test, and retain only the narrowed integration set."
