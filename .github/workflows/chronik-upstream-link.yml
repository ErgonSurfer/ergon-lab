# SPDX-License-Identifier: MIT
name: Chronik upstream host integration

on:
  pull_request:
    paths:
      - ".github/workflows/chronik-*.yml"
      - "CMakeLists.txt"
      - "chronik/**"
      - "src/CMakeLists.txt"
      - "src/chain.*"
      - "src/txmempool.*"
      - "src/util/source_generation.h"
      - "src/coins.*"
      - "src/dbwrapper.*"
      - "src/txdb.*"
      - "src/test/chronik_*upstream*tests.cpp"
      - "docs/engineering/chronik/**"
      - "docs/engineering/changes/ergon-change-0045.json"
      - "docs/engineering/changes/ergon-change-0046.json"
      - "docs/engineering/changes/ergon-change-0047.json"
      - "tools/engineering/check_chronik_*.py"
      - "tests/compatibility/upstream-chronik/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/chronik-*.yml"
      - "CMakeLists.txt"
      - "chronik/**"
      - "src/CMakeLists.txt"
      - "src/chain.*"
      - "src/txmempool.*"
      - "src/util/source_generation.h"
      - "src/coins.*"
      - "src/dbwrapper.*"
      - "src/txdb.*"
      - "src/test/chronik_*upstream*tests.cpp"
      - "docs/engineering/chronik/**"
      - "docs/engineering/changes/ergon-change-0045.json"
      - "docs/engineering/changes/ergon-change-0046.json"
      - "docs/engineering/changes/ergon-change-0047.json"
      - "tools/engineering/check_chronik_*.py"
      - "tests/compatibility/upstream-chronik/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronik-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Upstream integration (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # CMake invokes Cargo from an out-of-source directory; a source-local
      # rustup override alone would not select the reviewed compiler there.
      RUSTUP_TOOLCHAIN: "1.93.1"
    strategy:
      fail-fast: false
      matrix:
        profile: [archival, plugins, compiled-out]
    steps:
      - name: Check out complete public history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact current adaptations and historical donor preimages
        run: |
          python3 -B tools/engineering/check_chronik_upstream_link.py check
          python3 -B tools/engineering/check_chronik_port_core.py check
          python3 -B tools/engineering/check_chronik_chainstate_reads.py check
          python3 -B tools/engineering/check_chronik_chainstate_reads_self_test.py
          python3 -B tools/engineering/check_chronik_plugin_fixtures.py check
          python3 -B tools/engineering/check_chronik_plugin_fixtures_self_test.py
          python3 -B tests/compatibility/upstream-chronik/self_test.py
          python3 -B tests/compatibility/upstream-chronik/plugins/self_test.py

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libclang-dev libboost-all-dev \
            libevent-dev libssl-dev ninja-build pkg-config protobuf-compiler python3.12-dev

      - name: Record the actual unlocked system toolchain
        run: |
          gcc --version
          cmake --version
          ninja --version
          python3 --version
          protoc --version
          dpkg-query -W build-essential clang cmake libclang-dev libboost-all-dev libevent-dev libssl-dev ninja-build protobuf-compiler python3.12-dev
          printf '%s\n' 'Rust registry dependencies are locked; apt packages and runner image are not. No reproducible-build claim.'

      - name: Select pinned full upstream Rust toolchain and fetch locked inputs
        if: matrix.profile != 'compiled-out'
        run: |
          rustup toolchain install 1.93.1 --profile minimal --no-self-update
          rustup override set 1.93.1
          rustc --version | grep '^rustc 1.93.1 '
          cargo --version | grep '^cargo 1.93.1 '
          CARGO_HOME="$RUNNER_TEMP/ergon-upstream-cargo-home" cargo fetch --manifest-path chronik/Cargo.toml --locked

      - name: Configure separate out-of-source build
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          link=OFF
          archival=OFF
          plugins=OFF
          libclang_path=""
          if [ "$PROFILE" != compiled-out ]; then
            link=ON
            archival=ON
            libclang_library=$(find /usr/lib/llvm-* -path '*/lib/libclang.so' -print | sort -V | tail -n 1)
            test -n "$libclang_library"
            libclang_path=$(dirname "$libclang_library")
          fi
          if [ "$PROFILE" = plugins ]; then plugins=ON; fi
          cmake -S . -B "$RUNNER_TEMP/ergon-upstream-build" -GNinja \
            -DBUILD_CHRONIK_UPSTREAM_LINK="$link" \
            -DBUILD_CHRONIK_UPSTREAM_ARCHIVAL_TESTS="$archival" \
            -DBUILD_CHRONIK_UPSTREAM_PLUGIN_TESTS="$plugins" \
            -DBUILD_CHRONIK_OBSERVER=OFF \
            -DBUILD_CHRONIK_PORT_CORE=OFF -DBUILD_CHRONIK_BUILD_ONLY=OFF \
            -DBUILD_BITCOIN_WALLET=OFF -DBUILD_BITCOIN_QT=OFF \
            -DBUILD_BITCOIN_ZMQ=OFF -DENABLE_UPNP=OFF \
            -DCHRONIK_UPSTREAM_CARGO_HOME="$RUNNER_TEMP/ergon-upstream-cargo-home" \
            -DCHRONIK_UPSTREAM_TARGET_DIR="$RUNNER_TEMP/ergon-upstream-target" \
            -DCHRONIK_UPSTREAM_LIBCLANG_DIR="$libclang_path"

      - name: Build standalone daemon and native boundary fixtures
        run: cmake --build "$RUNNER_TEMP/ergon-upstream-build" --target bitcoind test_bitcoin -j2

      - name: Repeat exact profile-bound component cases in fresh processes
        if: matrix.profile != 'compiled-out'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 -B tests/compatibility/upstream-chronik/run_repetitions.py repeat \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --adaptation-manifest docs/engineering/chronik/upstream-host-adaptation-v1.json \
            --work-parent "$RUNNER_TEMP" --profile "$PROFILE" --repetitions 10 \
            --report "$RUNNER_TEMP/ergon-upstream-components.json"

      - name: Mine and stop without enabling any Chronik runtime
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          smoke_profile=compiled-out
          if [ "$PROFILE" = archival ]; then smoke_profile=upstream-linked-dormant; fi
          if [ "$PROFILE" = plugins ]; then smoke_profile=upstream-plugins-dormant; fi
          python3 -B tests/compatibility/upstream-chronik/run_repetitions.py smoke \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --adaptation-manifest docs/engineering/chronik/upstream-host-adaptation-v1.json \
            --work-parent "$RUNNER_TEMP" --profile "$smoke_profile" \
            --report "$RUNNER_TEMP/ergon-upstream-dormant-smoke.json"

      - name: Recheck sources after all build and execution steps
        run: |
          python3 -B tools/engineering/check_chronik_upstream_link.py check
          git diff --exit-code
          printf '%s\n' 'CI observations remain component-level; no deployment, daemon activation, mainnet replay or proof promotion.'
