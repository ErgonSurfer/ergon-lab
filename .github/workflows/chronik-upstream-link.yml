# SPDX-License-Identifier: MIT
name: Chronik upstream host integration

on:
  pull_request:
    paths:
      - ".github/workflows/chronik-*.yml"
      - "CMakeLists.txt"
      - "chronik/**"
      - "src/CMakeLists.txt"
      - "src/init.cpp"
      - "src/chain.*"
      - "src/txmempool.*"
      - "src/util/source_generation.h"
      - "src/coins.*"
      - "src/dbwrapper.*"
      - "src/txdb.*"
      - "src/test/chronik_*upstream*tests.cpp"
      - "src/test/main.cpp"
      - "docs/engineering/chronik/**"
      - "docs/engineering/changes/ergon-change-0045.json"
      - "docs/engineering/changes/ergon-change-0046.json"
      - "docs/engineering/changes/ergon-change-0047.json"
      - "docs/engineering/changes/ergon-change-0048.json"
      - "docs/engineering/changes/ergon-change-0049.json"
      - "docs/engineering/changes/ergon-change-0050.json"
      - "docs/engineering/changes/ergon-change-0051.json"
      - "docs/engineering/changes/ergon-change-0052.json"
      - "docs/engineering/changes/ergon-change-0053.json"
      - "docs/engineering/changes/ergon-change-0054.json"
      - "docs/engineering/changes/ergon-change-0055.json"
      - "docs/engineering/changes/ergon-change-0056.json"
      - "docs/engineering/changes/ergon-change-0057.json"
      - "docs/engineering/changes/ergon-change-0058.json"
      - "docs/engineering/changes/ergon-change-0059.json"
      - "docs/engineering/changes/ergon-change-0060.json"
      - "docs/engineering/changes/ergon-change-0061.json"
      - "docs/engineering/changes/ergon-change-0062.json"
      - "docs/engineering/changes/ergon-change-0063.json"
      - "docs/engineering/changes/ergon-change-0064.json"
      - "docs/engineering/changes/ergon-change-0065.json"
      - "tools/engineering/check_chronik_*.py"
      - "tests/compatibility/upstream-chronik/**"
      - "tests/community-plugins/**"
      - "plugins/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/chronik-*.yml"
      - "CMakeLists.txt"
      - "chronik/**"
      - "src/CMakeLists.txt"
      - "src/init.cpp"
      - "src/chain.*"
      - "src/txmempool.*"
      - "src/util/source_generation.h"
      - "src/coins.*"
      - "src/dbwrapper.*"
      - "src/txdb.*"
      - "src/test/chronik_*upstream*tests.cpp"
      - "src/test/main.cpp"
      - "docs/engineering/chronik/**"
      - "docs/engineering/changes/ergon-change-0045.json"
      - "docs/engineering/changes/ergon-change-0046.json"
      - "docs/engineering/changes/ergon-change-0047.json"
      - "docs/engineering/changes/ergon-change-0048.json"
      - "docs/engineering/changes/ergon-change-0049.json"
      - "docs/engineering/changes/ergon-change-0050.json"
      - "docs/engineering/changes/ergon-change-0051.json"
      - "docs/engineering/changes/ergon-change-0052.json"
      - "docs/engineering/changes/ergon-change-0053.json"
      - "docs/engineering/changes/ergon-change-0054.json"
      - "docs/engineering/changes/ergon-change-0055.json"
      - "docs/engineering/changes/ergon-change-0056.json"
      - "docs/engineering/changes/ergon-change-0057.json"
      - "docs/engineering/changes/ergon-change-0058.json"
      - "docs/engineering/changes/ergon-change-0059.json"
      - "docs/engineering/changes/ergon-change-0060.json"
      - "docs/engineering/changes/ergon-change-0061.json"
      - "docs/engineering/changes/ergon-change-0062.json"
      - "docs/engineering/changes/ergon-change-0063.json"
      - "docs/engineering/changes/ergon-change-0064.json"
      - "docs/engineering/changes/ergon-change-0065.json"
      - "tools/engineering/check_chronik_*.py"
      - "tests/compatibility/upstream-chronik/**"
      - "tests/community-plugins/**"
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronik-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Upstream integration (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # CMake invokes Cargo from an out-of-source directory; a source-local
      # rustup override alone would not select the reviewed compiler there.
      RUSTUP_TOOLCHAIN: "1.93.1"
    strategy:
      fail-fast: false
      matrix:
        profile: [archival, plugins, compiled-out, regtest, regtest-plugins]
    steps:
      - name: Check out complete public history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact current adaptations and historical donor preimages
        run: |
          python3 -B tools/engineering/check_chronik_upstream_link.py check
          python3 -B tools/engineering/check_chronik_port_core.py check
          python3 -B tools/engineering/check_chronik_chainstate_reads.py check
          python3 -B tools/engineering/check_chronik_chainstate_reads_self_test.py
          python3 -B tools/engineering/check_chronik_plugin_fixtures.py check
          python3 -B tools/engineering/check_chronik_plugin_fixtures_self_test.py
          python3 -B tools/engineering/check_chronik_plugin_restart.py check
          python3 -B tools/engineering/check_chronik_plugin_restart_self_test.py
          python3 -B tests/compatibility/upstream-chronik/self_test.py
          python3 -B tests/compatibility/upstream-chronik/plugins/self_test.py
          python3 -B tests/compatibility/upstream-chronik/plugin_restart_self_test.py
          python3 -B tools/engineering/check_chronik_regtest_service.py check
          python3 -B tools/engineering/check_chronik_regtest_service_self_test.py
          python3 -B tools/engineering/check_chronik_service_recovery.py check
          python3 -B tools/engineering/check_chronik_service_recovery_self_test.py
          python3 -B tools/engineering/check_chronik_service_startup.py check
          python3 -B tools/engineering/check_chronik_service_startup_self_test.py
          python3 -B tests/compatibility/upstream-chronik/regtest_service_self_test.py
          python3 -B tools/engineering/check_chronik_service_alp.py check
          python3 -B tools/engineering/check_chronik_service_alp_self_test.py
          python3 -B tests/compatibility/upstream-chronik/alp_service_self_test.py
          python3 -B tools/engineering/check_chronik_service_plugins.py check
          python3 -B tools/engineering/check_chronik_service_plugins_self_test.py
          python3 -B tests/compatibility/upstream-chronik/plugin_service_self_test.py
          python3 -B tools/engineering/check_chronik_plugin_alp.py check
          python3 -B tools/engineering/check_chronik_plugin_alp_self_test.py
          python3 -B tests/compatibility/upstream-chronik/plugin_alp_service_self_test.py
          python3 -B tools/engineering/check_chronik_service_catchup.py check
          python3 -B tools/engineering/check_chronik_service_catchup_self_test.py
          python3 -B tests/compatibility/upstream-chronik/catchup_service_self_test.py
          python3 -B tools/engineering/check_chronik_cold_rebuild.py check
          python3 -B tools/engineering/check_chronik_cold_rebuild_self_test.py
          python3 -B tests/compatibility/upstream-chronik/cold_rebuild_service_self_test.py
          python3 -B tools/engineering/check_chronik_startup_metadata.py check
          python3 -B tools/engineering/check_chronik_startup_metadata_self_test.py
          python3 -B tests/compatibility/upstream-chronik/startup_metadata_self_test.py
          python3 -B tools/engineering/check_chronik_owned_skip_links.py check
          python3 -B tools/engineering/check_chronik_owned_skip_links_self_test.py
          python3 -B tools/engineering/check_chronik_startup_release.py check
          python3 -B tools/engineering/check_chronik_startup_release_self_test.py
          python3 -B tools/engineering/check_chronik_startup_batches.py check
          python3 -B tools/engineering/check_chronik_startup_batches_self_test.py
          python3 -B tools/engineering/check_chronik_native_startup.py check
          python3 -B tools/engineering/check_chronik_native_startup_self_test.py
          python3 -B tools/engineering/check_chronik_long_history.py check
          python3 -B tools/engineering/check_chronik_long_history_self_test.py
          python3 -B tests/compatibility/upstream-chronik/long_history_service_self_test.py
          python3 -B tools/engineering/check_chronik_position_catalogue.py check
          python3 -B tools/engineering/check_chronik_position_catalogue_self_test.py
          python3 -B tools/engineering/check_chronik_multi_lokad.py check
          python3 -B tools/engineering/check_chronik_multi_lokad_self_test.py
          python3 -B tests/compatibility/upstream-chronik/multi_lokad_component_self_test.py
          python3 -B tools/engineering/check_chronik_external_plugins.py check
          python3 -B tools/engineering/check_chronik_external_plugins_self_test.py
          python3 -B tests/compatibility/upstream-chronik/operator_bundle_binding_self_test.py
          python3 -B tests/community-plugins/test_protocols.py --upstream-source .
          python3 -B tests/community-plugins/component_self_test.py --upstream-source .
          python3 -B tests/community-plugins/service_self_test.py

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libclang-dev libboost-all-dev \
            libevent-dev libssl-dev ninja-build pkg-config protobuf-compiler python3.12-dev

      - name: Record the actual unlocked system toolchain
        run: |
          gcc --version
          cmake --version
          ninja --version
          python3 --version
          protoc --version
          dpkg-query -W build-essential clang cmake libclang-dev libboost-all-dev libevent-dev libssl-dev ninja-build protobuf-compiler python3.12-dev
          printf '%s\n' 'Rust registry dependencies are locked; apt packages and runner image are not. No reproducible-build claim.'

      - name: Select pinned full upstream Rust toolchain and fetch locked inputs
        if: matrix.profile != 'compiled-out'
        run: |
          rustup toolchain install 1.93.1 --profile minimal --no-self-update
          rustup override set 1.93.1
          rustc --version | grep '^rustc 1.93.1 '
          cargo --version | grep '^cargo 1.93.1 '
          CARGO_HOME="$RUNNER_TEMP/ergon-upstream-cargo-home" cargo fetch --manifest-path chronik/Cargo.toml --locked

      - name: Configure separate out-of-source build
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          link=OFF
          archival=OFF
          plugins=OFF
          regtest=OFF
          regtest_plugins=OFF
          libclang_path=""
          if [ "$PROFILE" != compiled-out ]; then
            link=ON
            archival=ON
            libclang_library=$(find /usr/lib/llvm-* -path '*/lib/libclang.so' -print | sort -V | tail -n 1)
            test -n "$libclang_library"
            libclang_path=$(dirname "$libclang_library")
          fi
          if [ "$PROFILE" = plugins ]; then plugins=ON; fi
          if [ "$PROFILE" = regtest ]; then regtest=ON; fi
          if [ "$PROFILE" = regtest-plugins ]; then
            plugins=ON
            regtest=ON
            regtest_plugins=ON
          fi
          cmake -S . -B "$RUNNER_TEMP/ergon-upstream-build" -GNinja \
            -DBUILD_CHRONIK_UPSTREAM_LINK="$link" \
            -DBUILD_CHRONIK_UPSTREAM_ARCHIVAL_TESTS="$archival" \
            -DBUILD_CHRONIK_UPSTREAM_PLUGIN_TESTS="$plugins" \
            -DBUILD_CHRONIK_UPSTREAM_REGTEST="$regtest" \
            -DBUILD_CHRONIK_UPSTREAM_REGTEST_PLUGINS="$regtest_plugins" \
            -DBUILD_CHRONIK_OBSERVER=OFF \
            -DBUILD_CHRONIK_PORT_CORE=OFF -DBUILD_CHRONIK_BUILD_ONLY=OFF \
            -DBUILD_BITCOIN_WALLET=OFF -DBUILD_BITCOIN_QT=OFF \
            -DBUILD_BITCOIN_ZMQ=OFF -DENABLE_UPNP=OFF \
            -DCHRONIK_UPSTREAM_CARGO_HOME="$RUNNER_TEMP/ergon-upstream-cargo-home" \
            -DCHRONIK_UPSTREAM_TARGET_DIR="$RUNNER_TEMP/ergon-upstream-target" \
            -DCHRONIK_UPSTREAM_LIBCLANG_DIR="$libclang_path"

      - name: Build standalone daemon and native boundary fixtures
        run: cmake --build "$RUNNER_TEMP/ergon-upstream-build" --target bitcoind test_bitcoin -j2

      - name: Build and exercise bounded multi-identifier plugin metadata
        if: matrix.profile == 'plugins' || matrix.profile == 'regtest-plugins'
        env:
          CARGO_HOME: ${{ runner.temp }}/ergon-upstream-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/ergon-upstream-target
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
          PYO3_PYTHON: /usr/bin/python3.12
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo test --manifest-path chronik/Cargo.toml --package chronik-plugin-impl \
            --lib --no-run --message-format=json --locked --offline -j2 \
            > "$RUNNER_TEMP/ergon-multi-lokad-artifacts.jsonl"
          cargo build --manifest-path chronik/Cargo.toml --package chronik-plugin-impl \
            --example ergon-public-multi-lokad --locked --offline -j2
          mkdir "$RUNNER_TEMP/ergon-multi-lokad-work"
          python3 -B tests/compatibility/upstream-chronik/multi_lokad_component.py \
            --source-root "$GITHUB_WORKSPACE" \
            --target-dir "$RUNNER_TEMP/ergon-upstream-target" \
            --cargo-artifacts "$RUNNER_TEMP/ergon-multi-lokad-artifacts.jsonl" \
            --work-parent "$RUNNER_TEMP/ergon-multi-lokad-work"

      - name: Build and exercise the contributed plugins and trusted input contracts
        if: matrix.profile == 'plugins' || matrix.profile == 'regtest-plugins'
        env:
          CARGO_HOME: ${{ runner.temp }}/ergon-upstream-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/ergon-upstream-target
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
          PYO3_PYTHON: /usr/bin/python3.12
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo test --manifest-path chronik/Cargo.toml --package chronik-plugin-impl \
            --example ergon-community-plugins --no-run --message-format=json --locked --offline -j2 \
            > "$RUNNER_TEMP/ergon-community-artifacts.jsonl"
          cargo build --manifest-path chronik/Cargo.toml --package chronik-plugin-impl \
            --example ergon-community-plugins --locked --offline -j2
          mkdir "$RUNNER_TEMP/ergon-community-component-work"
          python3 -B tests/community-plugins/component.py \
            --source-root "$GITHUB_WORKSPACE" --target-dir "$RUNNER_TEMP/ergon-upstream-target" \
            --cargo-artifacts "$RUNNER_TEMP/ergon-community-artifacts.jsonl" \
            --work-parent "$RUNNER_TEMP/ergon-community-component-work"

      - name: Actual contributed plugins through isolated native regtest service
        if: matrix.profile == 'regtest-plugins'
        run: |
          mkdir "$RUNNER_TEMP/ergon-community-service-work"
          python3 -B tests/community-plugins/service.py \
            --source-root "$GITHUB_WORKSPACE" --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --example "$RUNNER_TEMP/ergon-upstream-target/debug/examples/ergon-community-plugins" \
            --work-parent "$RUNNER_TEMP/ergon-community-service-work" \
            --report "$RUNNER_TEMP/ergon-community-service.json" --repetitions 1

      - name: Repeat exact profile-bound component cases in fresh processes
        if: matrix.profile != 'compiled-out'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 -B tests/compatibility/upstream-chronik/run_repetitions.py repeat \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --adaptation-manifest docs/engineering/chronik/upstream-host-adaptation-v1.json \
            --work-parent "$RUNNER_TEMP" --profile "$PROFILE" --repetitions 10 \
            --report "$RUNNER_TEMP/ergon-upstream-components.json"

      - name: Restart real plugins and rebuild with upstream in separate processes
        if: matrix.profile == 'plugins'
        run: |
          mkdir "$RUNNER_TEMP/ergon-plugin-restart-work"
          python3 -B tests/compatibility/upstream-chronik/plugin_restart.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-plugin-restart-work" \
            --repetitions 10 --report "$RUNNER_TEMP/ergon-plugin-restart.json"

      - name: Real daemon regtest lifecycle with upstream service opt-in
        if: matrix.profile == 'regtest'
        run: |
          mkdir "$RUNNER_TEMP/ergon-regtest-service-work"
          python3 -B tests/compatibility/upstream-chronik/regtest_service.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-regtest-service-work" \
            --repetitions 3 --report "$RUNNER_TEMP/ergon-regtest-service.json"

      - name: Real daemon ALP cycle through the upstream indexer and router
        if: matrix.profile == 'regtest'
        run: |
          mkdir "$RUNNER_TEMP/ergon-regtest-alp-work"
          python3 -B tests/compatibility/upstream-chronik/alp_service.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-regtest-alp-work" \
            --repetitions 3 --report "$RUNNER_TEMP/ergon-regtest-alp.json"

      - name: Real daemon public plugin with process reopen and native failure isolation
        if: matrix.profile == 'regtest-plugins'
        run: |
          mkdir "$RUNNER_TEMP/ergon-regtest-plugin-work"
          python3 -B tests/compatibility/upstream-chronik/plugin_service.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-regtest-plugin-work" \
            --repetitions 3 --report "$RUNNER_TEMP/ergon-regtest-plugin.json"

      - name: Full upstream ALP cycle with the existing public plugin active
        if: matrix.profile == 'regtest-plugins'
        run: |
          mkdir "$RUNNER_TEMP/ergon-plugin-alp-work"
          python3 -B tests/compatibility/upstream-chronik/plugin_alp_service.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-plugin-alp-work" \
            --repetitions 3 --report "$RUNNER_TEMP/ergon-plugin-alp.json"

      - name: Compact service frontier and rapid native catchup with ALP and plugin data
        if: matrix.profile == 'regtest-plugins'
        run: |
          mkdir "$RUNNER_TEMP/ergon-service-catchup-work"
          python3 -B tests/compatibility/upstream-chronik/catchup_service.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-service-catchup-work" \
            --repetitions 3 --report "$RUNNER_TEMP/ergon-service-catchup.json"

      - name: Reconstruct historical ALP and plugin data through the upstream indexer
        if: matrix.profile == 'regtest-plugins'
        run: |
          mkdir "$RUNNER_TEMP/ergon-cold-rebuild-work"
          python3 -B tests/compatibility/upstream-chronik/cold_rebuild_service.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-cold-rebuild-work" \
            --repetitions 3 --report "$RUNNER_TEMP/ergon-cold-rebuild.json"

      - name: Reconstruct 5000 native regtest blocks with historical ALP and plugin data
        if: matrix.profile == 'regtest-plugins'
        run: |
          mkdir "$RUNNER_TEMP/ergon-long-history-work"
          python3 -B tests/compatibility/upstream-chronik/long_history_service.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-long-history-work" \
            --repetitions 1 --report "$RUNNER_TEMP/ergon-long-history.json"

      - name: Materialize the owned startup graph outside native locks
        if: matrix.profile == 'regtest-plugins'
        run: |
          mkdir "$RUNNER_TEMP/ergon-startup-metadata-work"
          python3 -B tests/compatibility/upstream-chronik/startup_metadata.py \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --work-parent "$RUNNER_TEMP/ergon-startup-metadata-work" \
            --repetitions 3 --report "$RUNNER_TEMP/ergon-startup-metadata.json"

      - name: Mine and stop with Chronik runtime default OFF
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          smoke_profile=compiled-out
          if [ "$PROFILE" = archival ]; then smoke_profile=upstream-linked-dormant; fi
          if [ "$PROFILE" = plugins ]; then smoke_profile=upstream-plugins-dormant; fi
          if [ "$PROFILE" = regtest ]; then smoke_profile=regtest; fi
          if [ "$PROFILE" = regtest-plugins ]; then smoke_profile=regtest-plugins; fi
          python3 -B tests/compatibility/upstream-chronik/run_repetitions.py smoke \
            --source-root "$GITHUB_WORKSPACE" \
            --build-root "$RUNNER_TEMP/ergon-upstream-build" \
            --adaptation-manifest docs/engineering/chronik/upstream-host-adaptation-v1.json \
            --work-parent "$RUNNER_TEMP" --profile "$smoke_profile" \
            --report "$RUNNER_TEMP/ergon-upstream-dormant-smoke.json"

      - name: Recheck sources after all build and execution steps
        run: |
          python3 -B tools/engineering/check_chronik_upstream_link.py check
          git diff --exit-code
          printf '%s\n' 'CI observations remain bounded regtest/component results; no deployment, mainnet activation or proof promotion.'
